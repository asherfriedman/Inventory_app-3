<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17684f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Customers</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contragents">
  <div class="app-shell">
    <header class="topbar">
      <div class="row">
        <button class="icon-btn" onclick="history.back()" aria-label="Back">←</button>
        <a class="icon-btn" href="index.html" aria-label="Home">H</a>
        <h1>Customers</h1>
        <div class="header-pill-group">
          <select class="header-select" id="contragentTypeFilter" aria-label="Contact type"><option value="">All</option><option value="1">Cust</option><option value="0">Supp</option></select>
          <button class="header-mini-btn" id="googlePanelBtn" type="button">Google</button>
        </div>
        <button class="header-mini-btn header-sync-btn" id="googleSyncBtn" type="button">Sync #</button>
      </div>
    </header>
    <section class="card toolbar hidden google-contact-panel" id="googleContactPanel">
      <div class="row between">
        <h2 style="margin:0;">Google Contacts</h2>
        <button class="icon-btn" id="googlePanelCloseBtn" type="button" aria-label="Close">x</button>
      </div>
      <div class="contragent-search-wrap">
        <input class="input" id="googleContactSearch" type="search" placeholder="Search Google Contacts" autocomplete="off">
        <button class="btn" id="googleSearchBtn" type="button">Search</button>
      </div>
      <div class="list" id="googleContactResults"></div>
    </section>
    <main class="page">
      <section class="card toolbar">
        <div class="contragent-search-wrap">
          <input class="input ctr-input" id="contragentSearch" type="search" inputmode="numeric" placeholder="Search by #..." autocomplete="off">
          <button class="kbd-toggle active" id="kbdToggle" type="button" title="Switch keyboard">123</button>
        </div>
      </section>
      <section class="card">
        <div class="row between"><h2>Contacts</h2><span class="tiny muted" id="contragentCountLabel">0 items</span></div>
        <div class="list" id="contragentsList"></div>
      </section>
    </main>
    <a class="btn btn-primary fab" href="contragent-form.html">+ Add</a>
  </div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script defer src="lib/sql-wasm.js"></script>
  <script defer src="js/local-db.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/google-contacts.js"></script>
  <script defer src="js/google-drive-backup.js"></script>
  <script defer src="js/contragents.js"></script>
</body>
</html>
