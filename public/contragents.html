<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#17684f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Customers</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contragents" data-tab="contragents">
  <div class="app-shell">
    <header class="appbar">
      <h1 id="contragentsTitle">Customers<span class="appbar-sub" id="contragentCountLabel">&nbsp;</span></h1>
      <div class="appbar-actions">
        <button class="text-btn" type="button" id="importBtn">Import</button>
      </div>
    </header>
    <main class="page">
      <div class="search-row">
        <label class="search">
          <span data-icon="search"></span>
          <input class="input" id="contragentSearch" type="search" inputmode="numeric" placeholder="Search by #" autocomplete="off">
          <button class="search-clear hidden" type="button" data-clear-for="contragentSearch" aria-label="Clear">&times;</button>
        </label>
        <button class="kbd-toggle active" id="kbdToggle" type="button" aria-label="Switch keyboard">123</button>
      </div>
      <div class="seg" id="contragentTypeFilter">
        <button type="button" data-type="1" class="active">Customers</button>
        <button type="button" data-type="0">Suppliers</button>
      </div>
      <section class="card flush"><div class="rows" id="contragentsList"></div></section>
      <button class="btn btn-plain btn-block hidden" type="button" id="showAllBtn">Show all</button>
    </main>
  </div>
  <a class="fab" href="contragent-form.html" id="addContragentFab"><span data-icon="plus"></span>Customer</a>

  <div class="modal" id="importModal" aria-hidden="true">
    <div class="sheet">
      <div class="sheet-grab"></div>
      <div class="sheet-head">
        <h2>Import from Google</h2>
        <button class="icon-btn" type="button" data-close-modal aria-label="Close" data-icon="x"></button>
      </div>
      <section class="card form-grid">
        <div class="hint">Sync brings in every Google contact whose name starts with #.</div>
        <button class="btn btn-soft btn-block" id="googleSyncBtn" type="button">Sync # contacts</button>
      </section>
      <section class="card form-grid">
        <div class="hint">Or find one contact and import it.</div>
        <div class="search-row">
          <label class="search">
            <span data-icon="search"></span>
            <input class="input" id="googleContactSearch" type="search" placeholder="Search Google Contacts" autocomplete="off">
          </label>
          <button class="btn" id="googleSearchBtn" type="button">Search</button>
        </div>
      </section>
      <section class="card flush" style="margin-top:12px"><div class="rows" id="googleContactResults"></div></section>
    </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script defer src="lib/sql-wasm.js"></script>
  <script defer src="js/local-db.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/google-contacts.js"></script>
  <script defer src="js/google-drive-backup.js"></script>
  <script defer src="js/contragents.js"></script>
</body>
</html>
