<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17684f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Documents</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="documents">
  <div class="app-shell">
    <header class="topbar">
      <div class="row">
        <button class="icon-btn" onclick="history.back()" aria-label="Back">←</button>
        <a class="icon-btn" href="index.html" aria-label="Home">H</a>
        <h1>Documents</h1>
        <select class="header-select" id="docTypeFilter" aria-label="Document type"><option value="">All</option><option value="1">In</option><option value="2">Out</option></select>
      </div>
      <div class="actions">
        <a class="icon-btn" href="document-form.html?type=1" aria-label="New incoming">📥</a>
        <a class="icon-btn" href="document-form.html?type=2" aria-label="New outgoing">📤</a>
      </div>
    </header>
    <main class="page">
      <section class="card">
        <div class="row between"><h2>Document List</h2><span class="tiny muted" id="documentsCountLabel">0 docs</span></div>
        <div class="list" id="documentsList"></div>
        <div class="tiny muted center hidden" id="documentsLoadMore">Loading...</div>
      </section>
    </main>
  </div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script defer src="lib/sql-wasm.js"></script>
  <script defer src="js/local-db.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/google-contacts.js"></script>
  <script defer src="js/google-drive-backup.js"></script>
  <script defer src="js/documents.js"></script>
</body>
</html>
