<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17684f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Documents</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="documents" data-tab="documents">
  <div class="app-shell">
    <header class="appbar">
      <h1>Documents<span class="appbar-sub" id="documentsCountLabel">&nbsp;</span></h1>
      <div class="appbar-actions">
        <a class="text-btn" href="document-form.html?type=1">Receive</a>
      </div>
    </header>
    <main class="page">
      <label class="search">
        <span data-icon="search"></span>
        <input class="input" id="docSearch" type="search" placeholder="Customer #, name, product, doc #" autocomplete="off">
        <button class="search-clear hidden" type="button" data-clear-for="docSearch" aria-label="Clear">&times;</button>
      </label>
      <div class="seg" id="docTypeFilter">
        <button type="button" data-type="" class="active">All</button>
        <button type="button" data-type="2">Sales</button>
        <button type="button" data-type="1">Receiving</button>
        <button type="button" data-type="3">Adjust</button>
      </div>
      <div id="documentsList"></div>
      <div class="empty hidden" id="documentsLoadMore">Loading...</div>
    </main>
  </div>
  <a class="fab" href="document-form.html?type=2"><span data-icon="plus"></span>New Sale</a>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script defer src="lib/sql-wasm.js"></script>
  <script defer src="js/local-db.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/google-contacts.js"></script>
  <script defer src="js/google-drive-backup.js"></script>
  <script defer src="js/documents.js"></script>
</body>
</html>
