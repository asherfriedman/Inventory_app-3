<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17684f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Inventory</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home" data-tab="home">
  <div class="app-shell">
    <header class="appbar">
      <h1>Inventory<span class="appbar-sub" id="todayLabel"></span></h1>
      <div class="appbar-actions">
        <a class="icon-btn" href="settings.html" aria-label="Settings" data-icon="gear"></a>
      </div>
    </header>
    <main class="page">
      <section class="quick-actions">
        <a class="quick-action primary" href="document-form.html?type=2"><span class="qa-icon" data-icon="sale"></span>New Sale</a>
        <a class="quick-action in" href="document-form.html?type=1"><span class="qa-icon" data-icon="receive"></span>Receive</a>
        <a class="quick-action adj" href="count.html"><span class="qa-icon" data-icon="count"></span>Count</a>
      </section>

      <section class="stats">
        <div class="stat">
          <div class="stat-label">Today</div>
          <div class="stat-value" data-stat="todays_sales">$0.00</div>
          <div class="stat-sub" data-stat="todays_count">0 sales</div>
        </div>
        <div class="stat">
          <div class="stat-label">This month</div>
          <div class="stat-value" data-stat="month_sales">$0.00</div>
          <div class="stat-sub" data-stat="month_count">0 sales</div>
        </div>
        <a class="stat wide" href="goods.html">
          <div class="stat-label">Inventory at cost</div>
          <div class="stat-value" data-stat="inventory_value">$0.00</div>
          <div class="stat-sub" data-stat="in_stock_products">0 products in stock</div>
        </a>
      </section>

      <div class="section-title"><span>Recent</span><a class="text-btn" href="documents.html">See all</a></div>
      <section class="card flush"><div class="rows" id="recentDocs"></div></section>
    </main>
  </div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script defer src="lib/sql-wasm.js"></script>
  <script defer src="js/local-db.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/google-contacts.js"></script>
  <script defer src="js/google-drive-backup.js"></script>
  <script defer src="js/home.js"></script>
</body>
</html>
