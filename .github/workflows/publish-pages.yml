name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Publish public folder to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          test -f public/index.html
          test -f public/sw.js

          workdir="$(mktemp -d)"
          cp -R public/. "$workdir/"
          touch "$workdir/.nojekyll"

          build_time="$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')"
          sed -i "s/^const BUILD_TIME = .*/const BUILD_TIME = \"${build_time}\";/" "$workdir/sw.js"

          # Give every script/style URL this commit's version so a phone can
          # never mix old and new files from its caches.
          version="${GITHUB_SHA::8}"
          sed -i "s/?v=dev/?v=${version}/g" "$workdir"/*.html

          cd "$workdir"
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish app from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
